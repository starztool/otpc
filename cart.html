<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Warenkorb | OTPC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/theme.css">
  </head>
  <body>
    <script src="chrome.js"></script>
    <main>
      <div class="wrap cart-layout" data-cart-page>
        <div>
          <p class="eyebrow">Warenkorb</p>
          <h1 class="display" style="font-size:clamp(1.8rem,3.4vw,2.6rem);margin-bottom:1rem;">Dein Build</h1>
          <div data-cart-page-list></div>
        </div>
        <aside class="cart-summary">
          <p class="eyebrow">Kasse</p>
          <div data-cart-page-sum></div>
          <a class="btn btn--solid" data-cart-checkout href="checkout.html" hidden style="width:100%;margin-top:1rem;">Zur Kasse</a>
        </aside>
      </div>
    </main>
    <footer class="footer">
      <div class="wrap">
        <img class="footer__logo" src="assets/otpc-logo.png" alt="OTPC">
        <div class="footer__legal"><span>© 2026 OTPC</span><span>Swiss Made</span></div>
      </div>
    </footer>
    <script src="assets/theme.js"></script>
    <script src="assets/live.js"></script>
  </body>
</html>
