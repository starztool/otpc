<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex,nofollow">
    <title>OTPC · Backoffice</title>
    <link rel="icon" href="assets/otpc-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/admin.css">
  </head>
  <body>
    <div id="gate" class="gate">
      <form class="gate__box" id="gate-form">
        <img src="assets/otpc-logo.png" alt="OTPC">
        <h1>Backoffice</h1>
        <p>Produkte, Bestellungen, Zahlungen. Nicht der Kundenshop.</p>
        <label class="field-lab">PIN
          <input class="field" id="pin" type="password" autocomplete="current-password" required>
        </label>
        <button class="btn" type="submit" style="width:100%">Öffnen</button>
        <p class="note" id="gate-note"></p>
      </form>
    </div>
    <div id="app" class="admin" hidden>
      <aside class="side">
        <div class="side__brand"><img src="assets/otpc-logo.png" alt="">OTPC</div>
        <button class="nav" type="button" data-go="home">Übersicht</button>
        <button class="nav" type="button" data-go="orders">Bestellungen</button>
        <button class="nav" type="button" data-go="products">Produkte</button>
        <button class="nav" type="button" data-go="customers">Kunden</button>
        <button class="nav" type="button" data-go="payments">Zahlungen</button>
        <button class="nav" type="button" data-go="shipping">Versand</button>
        <button class="nav" type="button" data-go="settings">Einstellungen</button>
        <div class="side__foot">Nur intern · PIN</div>
      </aside>
      <section class="main" id="view"></section>
    </div>
    <script src="assets/admin.js"></script>
  </body>
</html>
