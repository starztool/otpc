<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Shop | OTPC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/theme.css">
  </head>
  <body>
    <script src="chrome.js"></script>
    <div class="shop-intro" data-shop-intro role="dialog" aria-label="OTPC">
      <script>
        try {
          if (!/[?&]intro=1(?:&|$)/.test(location.search) && sessionStorage.getItem("otpc-shop-intro") === "1") {
            document.currentScript.parentElement.hidden = true;
          }
        } catch (e) {}
      </script>
      <button class="shop-intro__skip" type="button" data-intro-skip>Überspringen</button>
      <div class="shop-intro__world">
        <div class="shop-intro__fog"></div>
        <div class="shop-intro__floor"></div>
        <div class="shop-intro__pc3d">
          <img class="shop-intro__pc" src="assets/produkt-3.jpg" alt="" width="900" height="900">
        </div>
        <div class="shop-intro__mascot3d">
          <img class="shop-intro__mascot" src="assets/otpc-mascot.jpg" alt="" width="640" height="360">
        </div>
        <div class="shop-intro__logo3d">
          <p class="eyebrow">Swiss Made</p>
          <img class="shop-intro__logo" src="assets/otpc-logo.png" alt="OTPC" width="960" height="360">
        </div>
        <span class="shop-intro__flare"></span>
      </div>
    </div>
    <main id="main">
      <div class="wrap">
        <div class="shop-head">
          <div>
            <p class="eyebrow">Shop</p>
            <h1 class="display">Prebuilds</h1>
          </div>
          <p class="section__aside">Fertige PCs. Swiss Made.</p>
        </div>
        <div class="builds" style="margin-bottom:4rem;">
          <article class="build-card">
            <a href="produkt-1.html">
              <div class="build-card__top"><span>OTPC</span><span>Prebuild</span></div>
              <div class="build-card__media"><img src="assets/produkt-1.jpg" alt="Produkt 1"></div>
              <div class="build-card__foot"><span class="build-card__name">Produkt 1</span><span class="build-card__price">CHF 4'490</span></div>
            </a>
          </article>
          <article class="build-card">
            <a href="produkt-2.html">
              <div class="build-card__top"><span>OTPC</span><span>Prebuild</span></div>
              <div class="build-card__media"><img src="assets/produkt-2.jpg" alt="Produkt 2"></div>
              <div class="build-card__foot"><span class="build-card__name">Produkt 2</span><span class="build-card__price">CHF 3'890</span></div>
            </a>
          </article>
          <article class="build-card">
            <a href="produkt-3.html">
              <div class="build-card__top"><span>OTPC</span><span>Prebuild</span></div>
              <div class="build-card__media"><img src="assets/produkt-3.jpg" alt="Produkt 3"></div>
              <div class="build-card__foot"><span class="build-card__name">Produkt 3</span><span class="build-card__price">CHF 3'590</span></div>
            </a>
          </article>
        </div>
      </div>
    </main>
    <footer class="footer">
      <div class="wrap">
        <img class="footer__logo" src="assets/otpc-logo.png" alt="OTPC">
        <div class="footer__legal"><span>© 2026 OTPC</span><span>Swiss Made</span></div>
      </div>
    </footer>
    <script src="assets/theme.js"></script>
    <script src="assets/live.js"></script>
  </body>
</html>
