<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Kontakt | OTPC</title>
    <meta name="description" content="Kontakt OTPC. Mail, Discord-Ticket, Formular. Custom PCs, Schweiz.">
    <link rel="icon" href="assets/otpc-logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/theme.css">
  </head>
  <body>
    <script src="chrome.js"></script>
    <main id="main">
      <section class="section">
        <div class="page-narrow page-narrow--wide">
          <p class="eyebrow">Kontakt</p>
          <h1 class="display">Schreib uns</h1>
          <div class="contact-grid">
            <form class="form form--wide" id="ContactForm">
              <label class="field-lab">Name
                <input class="field" type="text" name="contact[name]" autocomplete="name" required>
              </label>
              <label class="field-lab">E-Mail
                <input class="field" type="email" name="contact[email]" autocomplete="email" required>
              </label>
              <label class="field-lab">Telefon (optional)
                <input class="field" type="tel" name="contact[phone]" autocomplete="tel">
              </label>
              <label class="field-lab">Betreff
                <input class="field" type="text" name="contact[Betreff]" required>
              </label>
              <label class="field-lab">Nachricht
                <textarea class="field" name="contact[body]" rows="6" required></textarea>
              </label>
              <button class="btn btn--solid" type="submit">Nachricht senden</button>
            </form>
            <aside class="contact-aside">
              <p class="eyebrow">Direkt</p>
              <p><a href="mailto:overtimepcs.support@gmail.com">overtimepcs.support@gmail.com</a></p>
              <p><a href="https://discord.gg/ZAGHdJxr2U">Discord · Ticket</a></p>
              <p>Antwort in der Regel 1–2 Werktage. Swiss Made, Support aus der Schweiz.</p>
              <p><a href="faq.html">FAQ</a></p>
            </aside>
          </div>
        </div>
      </section>
    </main>
    <footer class="footer"></footer>
    <script src="assets/catalog.js"></script>
    <script src="assets/theme.js"></script>
    <script src="assets/live.js"></script>
  </body>
</html>
